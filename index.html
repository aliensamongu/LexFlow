<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptureGram - Text Flow Workspace</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        panelBg: '#111827',
                        cardBg: '#1f2937',
                        lightBg: '#f8fafc',
                        lightPanel: '#ffffff',
                        lightCard: '#f1f5f9'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        html.dark body {
            background-color: #0b0f19;
            color: #f3f4f6;
        }

        html:not(.dark) body {
            background-color: #f8fafc;
            color: #0f172a;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        html:not(.dark) .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        [contenteditable]:focus { outline: none; }

        /* Document Canvas Positioning */
        #editorWrapper {
            position: relative;
            width: 100%;
        }

        /* Native Paragraph Styles with Reserved Right Padding for Controls */
        #flowEditor p, #flowEditor div, #flowEditor blockquote {
            position: relative;
            margin-top: 0.6rem;
            margin-bottom: 0.6rem;
            padding-right: 210px; /* Space reserved for margin metadata controls */
            word-break: break-word;
            line-height: 1.8;
            transition: margin-left 0.15s ease, border-left 0.15s ease, padding-left 0.15s ease;
        }

        /* Subordination Lines (Applied strictly per paragraph) */
        #flowEditor .has-indent {
            border-left: 2px solid #6366f1 !important;
            padding-left: 1.2rem !important;
        }

        /* Attach Downward Indicator Styling */
        #flowEditor .attach-down {
            border-left: 2px dashed #818cf8 !important;
            padding-left: 2.2rem !important;
        }

        #flowEditor .attach-down::before {
            content: "↳";
            position: absolute;
            left: 0.5rem;
            top: 0.15rem;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1;
            color: #6366f1;
            user-select: none;
            pointer-events: none;
        }

        html.dark #flowEditor .attach-down::before {
            color: #a5b4fc;
        }

        /* External Overlay Layer for Controls */
        #controlsOverlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .flow-meta-group {
            position: absolute;
            right: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            user-select: none;
            z-index: 10;
        }

        .flow-badge {
            display: inline-flex;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.12);
            color: #4f46e5;
            border: 1px solid rgba(99, 102, 241, 0.25);
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .flow-badge:hover {
            background: rgba(99, 102, 241, 0.25);
        }
        html.dark .flow-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border-color: rgba(129, 140, 248, 0.4);
        }

        /* Relationship Dropdown Select Styling */
        .relation-select {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 9999px;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s;
        }
        .relation-select:hover {
            transform: scale(1.02);
        }

        /* Hidden Color Picker Input */
        .color-picker-input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
            pointer-events: none;
        }

        .color-picker-btn {
            font-size: 12px;
            color: #9ca3af;
            cursor: pointer;
            transition: color 0.15s;
            padding: 2px;
        }
        .color-picker-btn:hover {
            color: #6366f1;
        }

        /* Collapsed State */
        .collapsed-active {
            opacity: 0.4;
            max-height: 1.8em;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* Focus Mode Active States */
        body.focus-mode #flowEditor > *:not(.focused-branch) {
            display: none !important;
        }
        .focused-branch {
            background: rgba(99, 102, 241, 0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed rgba(99, 102, 241, 0.4);
        }

        /* HIGHLIGHT STYLES WITH DARK MODE SUPPORT */
        mark.sg-hl-yellow {
            background-color: #fef08a !important;
            color: #854d0e !important;
            border-radius: 3px;
            padding: 1px 3px;
        }
        mark.sg-hl-green {
            background-color: #bbf7d0 !important;
            color: #14532d !important;
            border-radius: 3px;
            padding: 1px 3px;
        }
        mark.sg-hl-blue {
            background-color: #bfdbfe !important;
            color: #1e40af !important;
            border-radius: 3px;
            padding: 1px 3px;
        }
        mark.sg-hl-pink {
            background-color: #fbcfe8 !important;
            color: #831843 !important;
            border-radius: 3px;
            padding: 1px 3px;
        }
        mark.sg-hl-purple {
            background-color: #e9d5ff !important;
            color: #581c87 !important;
            border-radius: 3px;
            padding: 1px 3px;
        }

        /* Dark Mode adjustments for high legibility */
        html.dark mark.sg-hl-yellow { background-color: #854d0e !important; color: #fef08a !important; }
        html.dark mark.sg-hl-green { background-color: #14532d !important; color: #bbf7d0 !important; }
        html.dark mark.sg-hl-blue { background-color: #1e3a8a !important; color: #bfdbfe !important; }
        html.dark mark.sg-hl-pink { background-color: #831843 !important; color: #fbcfe8 !important; }
        html.dark mark.sg-hl-purple { background-color: #581c87 !important; color: #e9d5ff !important; }

        /* Floating Highlight Toolbar Animation */
        #highlightToolbar {
            transition: opacity 0.15s ease, transform 0.15s ease;
            transform: translateY(0);
        }
        #highlightToolbar.hidden {
            display: none !important;
            opacity: 0;
            transform: translateY(6px);
        }
    </style>
</head>

<body class="h-screen flex flex-col select-none">

    <!-- Top App Header -->
    <header class="bg-white dark:bg-panelBg border-b border-gray-200 dark:border-gray-800 px-4 py-2.5 flex justify-between items-center z-50 transition-colors shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-pen-nib text-lg"></i>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-tight text-gray-900 dark:text-white">ScriptureGram</h1>
                <p class="text-[11px] text-gray-500 dark:text-gray-400">Text Flow Workspace</p>
            </div>
        </div>

        <!-- Utility & User Actions -->
        <div class="flex items-center space-x-2">
            <button onclick="toggleFocusMode()" id="focusModeBtn" class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 text-xs font-medium px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 transition flex items-center space-x-1.5">
                <i class="fa-solid fa-expand text-indigo-500"></i>
                <span id="focusModeLabel">Focus Mode: Off</span>
            </button>
            <button onclick="toggleTheme()" id="themeToggleBtn" class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 text-xs font-medium px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 transition flex items-center space-x-1.5">
                <i id="themeIcon" class="fa-solid fa-sun text-amber-500"></i>
                <span id="themeLabel">Light</span>
            </button>
            <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition shadow flex items-center space-x-1">
                <i class="fa-solid fa-file-pdf mr-1"></i> Save to PDF
            </button>
        </div>
    </header>

    <!-- GLOBAL WORKSPACE PROJECTS BAR -->
    <div id="workspaceProjectBar" class="max-w-4xl mx-auto my-3 px-6 py-2 bg-white dark:bg-zinc-900 shadow-sm rounded-lg border border-gray-200 dark:border-zinc-800 flex items-center justify-between text-xs transition-colors shrink-0">
        <div class="flex items-center space-x-2">
            <span class="font-semibold text-gray-500 dark:text-gray-400">Active Project:</span>
            <select id="projectSelect" onchange="loadSelectedProject()" class="bg-gray-100 dark:bg-zinc-800 text-gray-800 dark:text-gray-200 rounded px-2.5 py-1 outline-none font-medium border border-gray-200 dark:border-zinc-700">
                <option value="scriptureGram_default">Default Scratchpad</option>
            </select>
            <button onclick="saveCurrentAsNewProject()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-medium transition shadow-sm">+ Save As New Project</button>
        </div>
        <div class="flex items-center space-x-3">
            <span id="globalSaveStatus" class="text-emerald-500 font-medium">Auto-saved</span>
            <button onclick="deleteCurrentProject()" class="px-2.5 py-1 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded transition font-medium">🗑 Delete Project</button>
        </div>
    </div>

    <!-- MAIN APP WORKSPACE (FULL WIDTH TEXT FLOW) -->
    <main class="flex-1 overflow-y-auto px-6 pb-6 bg-gray-50 dark:bg-zinc-950 flex flex-col custom-scrollbar">
        <div id="wordProcessorPane" class="max-w-4xl w-full mx-auto my-2 p-8 md:p-12 bg-white dark:bg-zinc-900 shadow-xl rounded-xl border border-gray-200 dark:border-zinc-800 flex flex-col transition-colors">
            
            <!-- Top Toolbar -->
            <div class="flex items-center justify-between pb-4 mb-6 border-b border-gray-200 dark:border-zinc-800 text-sm shrink-0">
                <div class="flex items-center space-x-3">
                    <span class="font-bold text-gray-800 dark:text-gray-200 tracking-wide">Thought Flow Document</span>
                    <span id="saveStatus" class="text-xs text-emerald-500 font-medium">Auto-saved</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="indentLine()" class="px-3 py-1.5 bg-gray-100 dark:bg-zinc-800 hover:bg-gray-200 dark:hover:bg-zinc-700 text-gray-700 dark:text-gray-300 rounded-md transition text-xs font-medium">Indent (Tab) →</button>
                    <button onclick="outdentLine()" class="px-3 py-1.5 bg-gray-100 dark:bg-zinc-800 hover:bg-gray-200 dark:hover:bg-zinc-700 text-gray-700 dark:text-gray-300 rounded-md transition text-xs font-medium">← Outdent (Shift+Tab)</button>
                    <button onclick="toggleAttachDown()" class="px-3 py-1.5 bg-indigo-50 dark:bg-indigo-950/50 hover:bg-indigo-100 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800 rounded-md transition text-xs font-medium">↓ Attach to Clause Below</button>
                    <button onclick="clearTextFlow()" class="px-3 py-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-md transition text-xs font-medium">Clear</button>
                </div>
            </div>

            <!-- Focus Mode Exit Banner -->
            <div id="focusBanner" class="hidden mb-4 p-3 bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 rounded-lg flex items-center justify-between text-xs text-indigo-700 dark:text-indigo-300">
                <span><i class="fa-solid fa-bullseye mr-1.5"></i> <strong>Focus Mode Active:</strong> Showing isolated branch.</span>
                <button onclick="toggleFocusMode()" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded transition">Exit Focus Mode</button>
            </div>
            
            <!-- Editor Canvas & Overlay Container -->
            <div id="editorWrapper">
                <div id="flowEditor" contenteditable="true" 
                     class="outline-none font-serif text-lg leading-loose text-gray-800 dark:text-gray-100 space-y-4 focus:ring-0"
                     style="min-height: 50vh;"
                     placeholder="Begin typing or pasting your scripture passage here to analyze the flow of thought...">
                </div>
                <div id="controlsOverlay"></div>
            </div>

            <!-- Bottom Status Bar -->
            <div class="pt-4 mt-8 border-t border-gray-100 dark:border-zinc-800 text-xs text-gray-400 flex justify-between items-center shrink-0">
                <span id="wordCountDisplay">0 words</span>
                <span class="italic">Tip: Select any phrase to display the floating color highlighter.</span>
            </div>
        </div>
    </main>

    <!-- FLOATING SELECTION HIGHLIGHT TOOLBAR -->
    <div id="highlightToolbar" class="fixed hidden z-50 bg-gray-900/90 dark:bg-zinc-800/95 backdrop-blur-md text-white p-1.5 rounded-full shadow-2xl border border-gray-700/50 flex items-center space-x-1.5 pointer-events-auto">
        <button onclick="applyHighlight('sg-hl-yellow')" class="w-6 h-6 rounded-full bg-yellow-300 hover:scale-110 transition shadow-inner" title="Yellow Highlight"></button>
        <button onclick="applyHighlight('sg-hl-green')" class="w-6 h-6 rounded-full bg-green-300 hover:scale-110 transition shadow-inner" title="Green Highlight"></button>
        <button onclick="applyHighlight('sg-hl-blue')" class="w-6 h-6 rounded-full bg-blue-300 hover:scale-110 transition shadow-inner" title="Blue Highlight"></button>
        <button onclick="applyHighlight('sg-hl-pink')" class="w-6 h-6 rounded-full bg-pink-300 hover:scale-110 transition shadow-inner" title="Pink Highlight"></button>
        <button onclick="applyHighlight('sg-hl-purple')" class="w-6 h-6 rounded-full bg-purple-300 hover:scale-110 transition shadow-inner" title="Purple Highlight"></button>
        <div class="w-px h-4 bg-gray-600 my-auto"></div>
        <button onclick="applyHighlight(null)" class="px-2 py-0.5 text-[11px] font-semibold text-gray-300 hover:text-white hover:bg-gray-700 rounded-full transition flex items-center" title="Remove Highlight">
            <i class="fa-solid fa-eraser mr-1"></i> Clear
        </button>
    </div>

    <!-- SCRIPT ENGINE -->
    <script>
        let currentProjectKey = localStorage.getItem('scriptureGram_activeProjectKey') || 'scriptureGram_default';
        let isFocusModeActive = false;
        let savedRange = null;
        
        const projectSelect = document.getElementById('projectSelect');
        const globalSaveStatus = document.getElementById('globalSaveStatus');
        const editor = document.getElementById('flowEditor');
        const overlay = document.getElementById('controlsOverlay');
        const wordCountDisplay = document.getElementById('wordCountDisplay');
        const saveStatus = document.getElementById('saveStatus');
        const highlightToolbar = document.getElementById('highlightToolbar');

        // Dynamic registry for user-defined custom relations
        let customRelationsRegistry = JSON.parse(localStorage.getItem('scriptureGram_customRelations') || '{}');

        const defaultRelations = {
            'Causal': { bg: '#fef3c7', text: '#92400e' },
            'Conditional': { bg: '#d1fae5', text: '#065f46' },
            'Result': { bg: '#e0f2fe', text: '#0369a1' },
            'Purpose': { bg: '#f3e8ff', text: '#6b21a8' },
            'Means': { bg: '#ccfbf1', text: '#115e59' },
            'Temporal': { bg: '#ffe4e6', text: '#9f1239' },
            'Adversative': { bg: '#fee2e2', text: '#991b1b' },
            'Explanation': { bg: '#f1f5f9', text: '#334155' }
        };

        function saveCustomRelationsRegistry() {
            localStorage.setItem('scriptureGram_customRelations', JSON.stringify(customRelationsRegistry));
        }

        document.addEventListener('DOMContentLoaded', () => {
            populateProjectsMenu();
            loadSelectedProject();
            
            if (editor) {
                editor.addEventListener('input', () => {
                    cleanEditorSpans();
                    syncOverlayControls();
                    updateWordCount();
                    saveActiveProjectData();
                });

                editor.addEventListener('keydown', (e) => {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        if (e.shiftKey) {
                            outdentLine();
                        } else {
                            indentLine();
                        }
                    }
                });

                window.addEventListener('resize', () => {
                    syncOverlayControls();
                    checkTextSelection();
                });

                document.querySelector('main').addEventListener('scroll', () => {
                    syncOverlayControls();
                    checkTextSelection();
                });
            }

            // Text Selection Listeners for Popup Toolbar
            document.addEventListener('selectionchange', handleSelectionChange);
            
            // Prevent clicking inside the toolbar from losing selection focus
            highlightToolbar.addEventListener('mousedown', (e) => e.preventDefault());
        });

        function handleSelectionChange() {
            setTimeout(checkTextSelection, 10);
        }

        function checkTextSelection() {
            const selection = window.getSelection();
            if (!selection || selection.isCollapsed || !editor.contains(selection.anchorNode)) {
                if (highlightToolbar) highlightToolbar.classList.add('hidden');
                return;
            }

            const range = selection.getRangeAt(0);
            const text = range.toString().trim();

            if (text.length === 0) {
                if (highlightToolbar) highlightToolbar.classList.add('hidden');
                return;
            }

            savedRange = range.cloneRange();

            const rect = range.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            const toolbarWidth = 230;
            let left = rect.left + (rect.width / 2) - (toolbarWidth / 2);
            let top = rect.top - 42;

            if (left < 10) left = 10;
            if (left + toolbarWidth > window.innerWidth - 10) left = window.innerWidth - toolbarWidth - 10;
            if (top < 10) top = rect.bottom + 8;

            highlightToolbar.style.left = `${left}px`;
            highlightToolbar.style.top = `${top}px`;
            highlightToolbar.classList.remove('hidden');
        }

        function applyHighlight(colorClass) {
            if (!savedRange) return;

            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(savedRange);

            if (!colorClass) {
                const mark = getAncestorMark(savedRange.commonAncestorContainer);
                if (mark) {
                    const parent = mark.parentNode;
                    while (mark.firstChild) {
                        parent.insertBefore(mark.firstChild, mark);
                    }
                    parent.removeChild(mark);
                } else {
                    document.execCommand('removeFormat', false, null);
                }
            } else {
                const mark = document.createElement('mark');
                mark.className = colorClass;
                
                try {
                    savedRange.surroundContents(mark);
                } catch (e) {
                    const fragment = savedRange.extractContents();
                    mark.appendChild(fragment);
                    savedRange.insertNode(mark);
                }
            }

            selection.removeAllRanges();
            if (highlightToolbar) highlightToolbar.classList.add('hidden');
            savedRange = null;

            syncOverlayControls();
            saveActiveProjectData();
        }

        function getAncestorMark(node) {
            let curr = node;
            while (curr && curr !== editor) {
                if (curr.nodeName === 'MARK') return curr;
                curr = curr.parentNode;
            }
            return null;
        }

        function cleanEditorSpans() {
            if (!editor) return;
            const spans = editor.querySelectorAll('span:not(.flow-meta-group)');
            spans.forEach(span => {
                while (span.firstChild) {
                    span.parentNode.insertBefore(span.firstChild, span);
                }
                span.remove();
            });
        }

        function indentLine() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            let block = selection.anchorNode;
            while (block && block.parentNode !== editor && block !== editor) {
                block = block.parentNode;
            }

            if (block && block !== editor) {
                const currentMargin = parseFloat(block.style.marginLeft || '0');
                block.style.marginLeft = (currentMargin + 1.5) + 'rem';
                syncOverlayControls();
                saveActiveProjectData();
            }
        }

        function outdentLine() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            let block = selection.anchorNode;
            while (block && block.parentNode !== editor && block !== editor) {
                block = block.parentNode;
            }

            if (block && block !== editor) {
                const currentMargin = parseFloat(block.style.marginLeft || '0');
                const newMargin = Math.max(0, currentMargin - 1.5);
                block.style.marginLeft = newMargin > 0 ? newMargin + 'rem' : '';
                syncOverlayControls();
                saveActiveProjectData();
            }
        }

        // SYNC OVERLAY CONTROLS TO EXACT PARAGRAPH POSITIONS
        function syncOverlayControls() {
            if (!editor || !overlay) return;
            overlay.innerHTML = '';

            const wrapperRect = document.getElementById('editorWrapper').getBoundingClientRect();
            const blocks = editor.querySelectorAll('p, div, blockquote');

            blocks.forEach(block => {
                const hasText = block.textContent.trim().length > 0;

                let level = 0;
                const styleAttr = block.getAttribute('style') || '';
                const marginMatch = styleAttr.match(/margin-left:\s*([0-9.]+)(rem|px|em)/);
                
                if (marginMatch) {
                    const val = parseFloat(marginMatch[1]);
                    level = val >= 1 ? Math.round(val / 1.5) : 1;
                } else if (block.style.marginLeft || block.classList.contains('attach-down')) {
                    level = 1;
                }

                if (!hasText) {
                    block.classList.remove('has-indent', 'attach-down', 'collapsed-active');
                    level = 0;
                } else if (level > 0 || block.style.marginLeft || block.classList.contains('attach-down')) {
                    if (level === 0) level = 1;

                    if (!block.classList.contains('attach-down')) {
                        block.classList.add('has-indent');
                    }

                    const rect = block.getBoundingClientRect();
                    const topOffset = rect.top - wrapperRect.top;

                    let currentRelation = block.dataset.relation || '';
                    let customBg = block.dataset.relBg || '';
                    let customText = block.dataset.relText || '';

                    const group = document.createElement('div');
                    group.className = 'flow-meta-group';
                    group.style.top = topOffset + 'px';

                    // Level Badge
                    const badge = document.createElement('span');
                    badge.className = 'flow-badge';
                    const isCollapsed = block.classList.contains('collapsed-active');
                    badge.innerHTML = isCollapsed 
                        ? `L${level} <i class="fa-solid fa-chevron-right ml-1.5 text-[9px]"></i>` 
                        : `L${level} <i class="fa-solid fa-chevron-down ml-1.5 text-[9px]"></i>`;

                    badge.title = 'Click to collapse/expand branch';
                    badge.onclick = () => {
                        block.classList.toggle('collapsed-active');
                        syncOverlayControls();
                        saveActiveProjectData();
                    };

                    // Relationship Dropdown
                    const select = document.createElement('select');
                    select.className = 'relation-select';

                    function updateSelectStyle(relName, bg, text) {
                        if (relName && defaultRelations[relName]) {
                            select.style.backgroundColor = defaultRelations[relName].bg;
                            select.style.color = defaultRelations[relName].text;
                        } else if (relName && customRelationsRegistry[relName]) {
                            select.style.backgroundColor = customRelationsRegistry[relName].bg;
                            select.style.color = customRelationsRegistry[relName].text;
                        } else if (bg && text) {
                            select.style.backgroundColor = bg;
                            select.style.color = text;
                        } else {
                            select.style.backgroundColor = '';
                            select.style.color = '';
                            select.className = 'relation-select bg-gray-100 hover:bg-gray-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-zinc-700';
                        }
                    }

                    updateSelectStyle(currentRelation, customBg, customText);

                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = '';
                    defaultOpt.textContent = '+ Relation';
                    select.appendChild(defaultOpt);

                    // Standard Presets
                    Object.keys(defaultRelations).forEach(relKey => {
                        const opt = document.createElement('option');
                        opt.value = relKey;
                        opt.textContent = relKey;
                        if (relKey === currentRelation) opt.selected = true;
                        select.appendChild(opt);
                    });

                    // Saved Custom Labels
                    const customKeys = Object.keys(customRelationsRegistry);
                    if (customKeys.length > 0) {
                        const optGroup = document.createElement('optgroup');
                        optGroup.label = 'Custom Saved Labels';
                        customKeys.forEach(customKey => {
                            const opt = document.createElement('option');
                            opt.value = customKey;
                            opt.textContent = customKey;
                            if (customKey === currentRelation) opt.selected = true;
                            optGroup.appendChild(opt);
                        });
                        select.appendChild(optGroup);
                    }

                    if (currentRelation && !defaultRelations[currentRelation] && !customRelationsRegistry[currentRelation]) {
                        const customOpt = document.createElement('option');
                        customOpt.value = currentRelation;
                        customOpt.textContent = currentRelation;
                        customOpt.selected = true;
                        select.appendChild(customOpt);
                    }

                    const addCustomOpt = document.createElement('option');
                    addCustomOpt.value = '__custom__';
                    addCustomOpt.textContent = '+ Custom Label...';
                    select.appendChild(addCustomOpt);

                    select.onchange = () => {
                        const val = select.value;
                        if (val === '__custom__') {
                            const customName = prompt('Enter custom relationship name (e.g., "Contrast", "Hortatory"):');
                            if (customName && customName.trim()) {
                                const cleanName = customName.trim();
                                block.dataset.relation = cleanName;
                                if (!block.dataset.relBg) {
                                    block.dataset.relBg = '#e0e7ff';
                                    block.dataset.relText = '#3730a3';
                                }
                                customRelationsRegistry[cleanName] = {
                                    bg: block.dataset.relBg,
                                    text: block.dataset.relText
                                };
                                saveCustomRelationsRegistry();
                            }
                        } else if (!val) {
                            block.removeAttribute('data-relation');
                            block.removeAttribute('data-rel-bg');
                            block.removeAttribute('data-rel-text');
                        } else {
                            block.dataset.relation = val;
                            if (customRelationsRegistry[val]) {
                                block.dataset.relBg = customRelationsRegistry[val].bg;
                                block.dataset.relText = customRelationsRegistry[val].text;
                            } else {
                                block.removeAttribute('data-rel-bg');
                                block.removeAttribute('data-rel-text');
                            }
                        }
                        syncOverlayControls();
                        saveActiveProjectData();
                    };

                    // Color Picker
                    const colorInput = document.createElement('input');
                    colorInput.type = 'color';
                    colorInput.className = 'color-picker-input';
                    colorInput.value = customBg || (currentRelation && customRelationsRegistry[currentRelation] ? customRelationsRegistry[currentRelation].bg : '#6366f1');
                    colorInput.onchange = (e) => {
                        const bgHex = e.target.value;
                        const r = parseInt(bgHex.substr(1,2), 16);
                        const g = parseInt(bgHex.substr(3,2), 16);
                        const b = parseInt(bgHex.substr(5,2), 16);
                        const yiq = (r * 299 + g * 587 + b * 114) / 1000;
                        const textHex = yiq >= 128 ? '#111827' : '#f9fafb';

                        block.dataset.relBg = bgHex;
                        block.dataset.relText = textHex;
                        if (!currentRelation) block.dataset.relation = 'Custom';

                        const relName = block.dataset.relation;
                        if (relName && !defaultRelations[relName]) {
                            customRelationsRegistry[relName] = { bg: bgHex, text: textHex };
                            saveCustomRelationsRegistry();
                        }

                        syncOverlayControls();
                        saveActiveProjectData();
                    };

                    const colorBtn = document.createElement('label');
                    colorBtn.className = 'color-picker-btn';
                    colorBtn.innerHTML = '<i class="fa-solid fa-palette"></i>';
                    colorBtn.title = 'Choose custom color';
                    colorBtn.onclick = () => colorInput.click();
                    colorBtn.appendChild(colorInput);

                    // Focus Button
                    const focusBtn = document.createElement('button');
                    focusBtn.className = 'text-gray-400 hover:text-indigo-600 px-1 text-xs transition';
                    focusBtn.innerHTML = '<i class="fa-solid fa-bullseye"></i>';
                    focusBtn.title = 'Isolate this branch';
                    focusBtn.onclick = () => {
                        document.querySelectorAll('.focused-branch').forEach(b => b.classList.remove('focused-branch'));
                        block.classList.toggle('focused-branch');
                        if (!isFocusModeActive) toggleFocusMode();
                    };

                    group.appendChild(badge);
                    group.appendChild(select);
                    group.appendChild(colorBtn);
                    group.appendChild(focusBtn);
                    overlay.appendChild(group);
                } else {
                    block.classList.remove('has-indent', 'collapsed-active');
                }
            });
        }

        function toggleFocusMode() {
            isFocusModeActive = !isFocusModeActive;
            document.body.classList.toggle('focus-mode', isFocusModeActive);
            
            const label = document.getElementById('focusModeLabel');
            const btn = document.getElementById('focusModeBtn');
            const banner = document.getElementById('focusBanner');

            if (isFocusModeActive) {
                label.textContent = "Focus Mode: On";
                btn.className = "bg-indigo-600 text-white text-xs font-medium px-3 py-1.5 rounded-lg border border-indigo-500 transition flex items-center space-x-1.5 shadow-sm";
                if (banner) banner.classList.remove('hidden');
            } else {
                label.textContent = "Focus Mode: Off";
                btn.className = "bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 text-xs font-medium px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 transition flex items-center space-x-1.5";
                if (banner) banner.classList.add('hidden');
                document.querySelectorAll('.focused-branch').forEach(b => b.classList.remove('focused-branch'));
            }
            syncOverlayControls();
        }

        function updateWordCount() {
            if (!editor || !wordCountDisplay) return;
            const text = editor.innerText || '';
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            wordCountDisplay.textContent = `${words} words`;
        }

        function toggleAttachDown() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;

            let node = selection.anchorNode;
            while (node && node !== editor && !['P', 'DIV', 'BLOCKQUOTE'].includes(node.nodeName)) {
                node = node.parentNode;
            }

            if (node && node !== editor) {
                node.classList.toggle('attach-down');
                syncOverlayControls();
                saveActiveProjectData();
            }
        }

        function clearTextFlow() {
            if (confirm('Are you sure you want to clear your thought flow notes?')) {
                if (editor) editor.innerHTML = '';
                updateWordCount();
                syncOverlayControls();
                saveActiveProjectData();
            }
        }

        // PROJECT MANAGEMENT
        function getProjectsCatalog() {
            return JSON.parse(localStorage.getItem('scriptureGram_catalog') || '{}');
        }

        function populateProjectsMenu() {
            if (!projectSelect) return;
            const catalog = getProjectsCatalog();
            projectSelect.innerHTML = '<option value="scriptureGram_default">Default Scratchpad</option>';
            Object.keys(catalog).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = catalog[key];
                if (key === currentProjectKey) opt.selected = true;
                projectSelect.appendChild(opt);
            });
        }

        function saveActiveProjectData() {
            const projectData = {
                textFlowHTML: editor.innerHTML,
                updatedAt: Date.now()
            };
            localStorage.setItem(currentProjectKey, JSON.stringify(projectData));
            if (globalSaveStatus) {
                globalSaveStatus.textContent = 'Saving...';
                setTimeout(() => { globalSaveStatus.textContent = 'Auto-saved'; }, 400);
            }
            if (saveStatus) {
                saveStatus.textContent = 'Saving...';
                setTimeout(() => { saveStatus.textContent = 'Auto-saved'; }, 400);
            }
        }

        function loadSelectedProject() {
            if (!projectSelect) return;
            currentProjectKey = projectSelect.value;
            localStorage.setItem('scriptureGram_activeProjectKey', currentProjectKey);

            const rawData = localStorage.getItem(currentProjectKey);

            if (rawData) {
                try {
                    const projectData = JSON.parse(rawData);
                    if (editor) editor.innerHTML = projectData.textFlowHTML || '';
                } catch (e) {
                    if (editor) editor.innerHTML = rawData;
                }
            } else {
                if (editor) editor.innerHTML = '';
            }
            cleanEditorSpans();
            syncOverlayControls();
            updateWordCount();
        }

        function saveCurrentAsNewProject() {
            const title = prompt('Enter a name for this project (e.g., "Hebrews 1:1-4 Flow"):');
            if (!title || !title.trim()) return;
            const newKey = 'scriptureGram_proj_' + Date.now();
            const catalog = getProjectsCatalog();
            catalog[newKey] = title.trim();
            localStorage.setItem('scriptureGram_catalog', JSON.stringify(catalog));
            currentProjectKey = newKey;
            localStorage.setItem('scriptureGram_activeProjectKey', currentProjectKey);
            saveActiveProjectData();
            populateProjectsMenu();
            if (projectSelect) projectSelect.value = newKey;
        }

        function deleteCurrentProject() {
            if (currentProjectKey === 'scriptureGram_default') {
                if (confirm('Reset default scratchpad?')) {
                    if (editor) editor.innerHTML = '';
                    localStorage.removeItem('scriptureGram_default');
                    updateWordCount();
                    syncOverlayControls();
                }
                return;
            }
            if (confirm('Delete this project?')) {
                localStorage.removeItem(currentProjectKey);
                let catalog = getProjectsCatalog();
                delete catalog[currentProjectKey];
                localStorage.setItem('scriptureGram_catalog', JSON.stringify(catalog));
                currentProjectKey = 'scriptureGram_default';
                localStorage.setItem('scriptureGram_activeProjectKey', currentProjectKey);
                populateProjectsMenu();
                loadSelectedProject();
            }
        }

        // THEME TOGGLE
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');
            
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('scriptureGram_theme', isDark ? 'dark' : 'light');

            if (isDark) {
                themeIcon.className = "fa-solid fa-moon text-indigo-400";
                themeLabel.textContent = "Dark";
            } else {
                themeIcon.className = "fa-solid fa-sun text-amber-500";
                themeLabel.textContent = "Light";
            }
        }

        if (localStorage.getItem('scriptureGram_theme') === 'dark' || (!localStorage.getItem('scriptureGram_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');
            if (themeIcon) themeIcon.className = "fa-solid fa-moon text-indigo-400";
            if (themeLabel) themeLabel.textContent = "Dark";
        }
    </script>
</body>
</html>
